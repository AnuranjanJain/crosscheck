<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="50%" style="stop-color:#7b68ee"/>
      <stop offset="100%" style="stop-color:#00d2ff"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38ef7d"/>
      <stop offset="100%" style="stop-color:#11998e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <!-- Dot pattern -->
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)" rx="12"/>
  <rect width="1200" height="300" fill="url(#grid)" rx="12"/>
  <rect width="1200" height="300" fill="url(#dots)" rx="12"/>
  
  <!-- Animated floating orbs -->
  <circle cx="150" cy="80" r="60" fill="rgba(123,104,238,0.08)" filter="url(#softGlow)">
    <animate attributeName="cy" values="80;120;80" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="60;75;60" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="220" r="50" fill="rgba(0,210,255,0.06)" filter="url(#softGlow)">
    <animate attributeName="cy" values="220;180;220" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="50;65;50" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="50" r="40" fill="rgba(56,239,125,0.05)" filter="url(#softGlow)">
    <animate attributeName="cx" values="600;650;600" dur="7s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Decorative lines -->
  <line x1="80" y1="260" x2="350" y2="260" stroke="rgba(0,210,255,0.15)" stroke-width="1">
    <animate attributeName="x2" values="350;380;350" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="850" y1="40" x2="1120" y2="40" stroke="rgba(123,104,238,0.15)" stroke-width="1">
    <animate attributeName="x1" values="850;820;850" dur="3s" repeatCount="indefinite"/>
  </line>
  
  <!-- Checkmark icon -->
  <g transform="translate(365, 75)" filter="url(#glow)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/>
    </rect>
    <polyline points="14,28 24,38 42,18" fill="none" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="0,100;60,100" dur="1.5s" fill="freeze"/>
    </polyline>
  </g>
  
  <!-- Main title -->
  <text x="440" y="118" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="url(#textGrad)" filter="url(#glow)" letter-spacing="-1">
    Crosscheck
  </text>
  
  <!-- Subtitle -->
  <text x="390" y="165" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="rgba(255,255,255,0.7)" letter-spacing="1">
    Evidence-First Fact Verification for PDFs
  </text>
  
  <!-- Description line -->
  <text x="390" y="200" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="rgba(255,255,255,0.4)" letter-spacing="0.5">
    Extract · Compare · Verify — Cross-document claim analysis with source evidence
  </text>
  
  <!-- Animated scan line -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#textGrad)" opacity="0.1">
    <animate attributeName="y" values="0;300;0" dur="8s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Bottom accent bar -->
  <rect x="0" y="294" width="1200" height="6" rx="0" fill="url(#textGrad)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Corner accents -->
  <path d="M 20 20 L 20 50" stroke="rgba(0,210,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 20 20 L 50 20" stroke="rgba(0,210,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 1180 280 L 1180 250" stroke="rgba(123,104,238,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 1180 280 L 1150 280" stroke="rgba(123,104,238,0.3)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
